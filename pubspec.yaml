name: growiq
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:

  cupertino_icons: ^1.0.8
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_storage: ^13.0.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.13.1
  flutter_svg: ^1.1.6
  fluttertoast: ^9.0.0       #display state messages
  font_awesome_flutter: ^10.12.0
  get_it: ^9.2.0
  glaze_nav_bar: ^1.2.1
  go_router: ^17.0.1
  google_fonts: ^8.0.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.1
  lottie: ^3.3.2
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.5.4
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  http: ^1.1.0
  file_picker: ^8.0.0
  flutter_markdown: ^0.7.7+1
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  firebase_database: ^12.1.4


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/lottie/
    - assets/data/Devices.json

flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_assets.dart
  field_prefix: null

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo2.png"


